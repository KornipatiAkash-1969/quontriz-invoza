databases:
  - name: quontriz-invoza-db
    databaseName: quontriz_invoza
    user: quontriz_user
    plan: free
    region: oregon

services:
  - type: web
    name: quontriz-invoza
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quontriz-invoza-db
          property: connectionString
      - key: JWT_SECRET
        value: quontriz_invoza_jwt_secret_key_2026_secure
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: akash.kornipati1969@gmail.com
      - key: SMTP_PASS
        value: oogztajfdfphxzwq
      - key: SMTP_FROM
        value: '"Quontriz Invoza" <akash.kornipati1969@gmail.com>'
