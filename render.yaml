databases:
  - name: quontriz-invoza-db
    databaseName: quontriz_invoza
    user: quontriz_user
    plan: free
    region: oregon

services:
  - type: web
    name: quontriz-invoza
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quontriz-invoza-db
          property: connectionString
      - key: PG_CONNECT_TIMEOUT
        value: "20000"
      - key: PG_MAX_POOL
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: SMTP_FROM
        value: '"Quontriz Invoza" <notifications@supermarket.com>'
